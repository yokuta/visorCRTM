<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f5f8">
  <title>Visor CRTM · Movilidad en Madrid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root {
      font-family: "Manrope", "Segoe UI", Arial, sans-serif;
      color-scheme: light;
      --texto: #182230;
      --muted: #617083;
      --linea: rgba(22, 38, 56, .12);
      --fondo: #e9edf2;
      --panel: rgba(255, 255, 255, .94);
      --azul: #2463b4;
      --sombra: 0 24px 72px rgba(24, 36, 51, .18);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--fondo); color: var(--texto); }
    button { font: inherit; }
    #mapa { position: fixed; inset: 0; z-index: 0; background: var(--fondo); }
    .mapa-velo { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, rgba(244,247,250,.48), transparent 65%); }
    .panel {
      position: fixed; z-index: 600; left: 20px; top: 20px; bottom: 20px;
      width: min(405px, calc(100% - 40px));
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--linea); border-radius: 24px;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--sombra); transition: transform .5s ease, opacity .5s ease;
    }
    .cabecera { padding: 30px 28px 24px; border-bottom: 1px solid var(--linea); }
    .marca { display: flex; align-items: center; gap: 11px; font-size: .76rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .marca-icono { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 11px; color: white; background: var(--azul); font-size: 1.05rem; letter-spacing: 0; }
    h1 { margin: 24px 0 12px; font-size: clamp(1.8rem, 3vw, 2.2rem); line-height: 1.16; letter-spacing: -.048em; }
    .intro { margin: 0; color: var(--muted); line-height: 1.65; font-size: .9rem; }
    .seccion { padding: 24px 20px; overflow: auto; flex: 1; }
    .seccion h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .11em; margin: 0 8px 14px; color: var(--muted); }
    .tarjeta {
      display: flex; width: 100%; padding: 20px 18px; align-items: flex-start; text-align: left; gap: 15px;
      background: #fff; border: 1px solid #dce3ec; border-radius: 17px;
      cursor: pointer; box-shadow: 0 7px 22px rgba(42, 69, 104, .07);
      transition: box-shadow .2s, border-color .2s, transform .2s;
    }
    .tarjeta:hover { transform: translateY(-2px); border-color: #91b5e8; box-shadow: 0 12px 28px rgba(42,69,104,.13); }
    .tarjeta:focus-visible, .volver:focus-visible { outline: 3px solid #4e95ed; outline-offset: 3px; }
    .insignia { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 14px; background: var(--azul); color: white; font-size: 1.2rem; font-weight: 800; }
    .detalle { min-width: 0; flex: 1; }
    .titulo-tarjeta { display: block; font-size: 1.03rem; font-weight: 800; letter-spacing: -.018em; }
    .fecha { display: block; font-size: .74rem; font-weight: 700; color: var(--azul); margin: 5px 0 10px; }
    .subtitulo { display: block; font-size: .82rem; color: var(--muted); line-height: 1.55; }
    .abrir-texto { display: inline-flex; align-items: center; gap: 5px; margin-top: 15px; font-weight: 800; color: var(--azul); font-size: .82rem; }
    .pie { padding: 17px 28px; border-top: 1px solid var(--linea); font-size: .74rem; line-height: 1.6; color: var(--muted); }
    .estado { margin: 15px 8px; color: var(--muted); line-height: 1.5; font-size: .87rem; }
    .estado.error { color: #a33a30; }
    .contador { position: fixed; z-index: 400; right: 22px; bottom: 24px; background: rgba(255,255,255,.95); border-radius: 999px; padding: 9px 16px; border: 1px solid var(--linea); box-shadow: 0 4px 15px rgba(22,38,56,.1); font-size: .79rem; color: var(--muted); }
    .escena { position: fixed; inset: 0; z-index: 1200; background: var(--fondo); visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .35s ease, visibility .35s; }
    .escena.visible { visibility: visible; opacity: 1; pointer-events: auto; }
    .escena iframe { width: 100%; height: 100%; display: block; border: 0; }
    .volver { position: absolute; z-index: 1400; top: 17px; right: 17px; padding: 12px 19px; background: rgba(255,255,255,.97); color: var(--texto); border: 1px solid var(--linea); box-shadow: 0 8px 30px rgba(22,38,56,.18); border-radius: 999px; cursor: pointer; font-size: .86rem; font-weight: 800; }
    @media (max-width: 700px) {
      .panel { top: auto; bottom: 9px; left: 9px; width: calc(100% - 18px); height: auto; max-height: 61%; border-radius: 18px; }
      .cabecera { padding: 18px 20px 16px; }
      h1 { font-size: 1.4rem; margin: 13px 0 8px; }
      .intro { font-size: .81rem; }
      .seccion { padding: 14px; }
      .tarjeta { padding: 13px; }
      .pie { display: none; }
      .contador { top: 14px; right: 12px; bottom: auto; }
      .volver { right: 10px; top: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div id="mapa" aria-label="Mapa de las estaciones de Madrid"></div>
  <div class="mapa-velo" aria-hidden="true"></div>

  <aside class="panel" aria-label="Catálogo de mapas">
    <header class="cabecera">
      <div class="marca"><span class="marca-icono">M</span><span>Visor CRTM · Madrid</span></div>
      <p class="intro">Diferentes mapas</p>
    </header>
    <main class="seccion">
      <h2>Visualizaciones disponibles</h2>
      <div id="lista"><p class="estado">Cargando catálogo…</p></div>
    </main>
    <footer class="pie">Análisis de validaciones · Febrero de 2022<br>Visualización exploratoria de datos de movilidad.</footer>
  </aside>

  <div class="contador" id="contador" hidden></div>

  <section class="escena" id="escena" aria-label="Visor de estaciones">
    <iframe id="visor" title="Demanda en estaciones de Madrid" loading="eager"></iframe>
    <button type="button" class="volver" id="volver">← Volver al catálogo</button>
  </section>

  <script>
    const panelLista = document.getElementById("lista");
    const escena = document.getElementById("escena");
    const visor = document.getElementById("visor");
    let catalogo = [];
    let mapa = null;

    // Vista previa de estaciones en el mapa de la portada.
    // La página sigue funcionando si Leaflet o la vista previa no se cargan.
    if (window.L) {
      mapa = L.map("mapa", { zoomControl: false, preferCanvas: true }).setView([40.425, -3.70], 11);
      L.control.zoom({ position: "bottomright" }).addTo(mapa);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Esri, HERE, Garmin, © OpenStreetMap", maxZoom: 17
      }).addTo(mapa);
    }

    // Lector CSV sencillo con soporte para nombres entre comillas y comas.
    function parseCSV(texto) {
      texto = texto.replace(/^\uFEFF/, "");
      const filas = [];
      let fila = [], campo = "", comillas = false;
      for (let i = 0; i < texto.length; i++) {
        const c = texto[i];
        if (comillas) {
          if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
          else if (c === '"') comillas = false;
          else campo += c;
        } else if (c === '"') comillas = true;
        else if (c === ',') { fila.push(campo); campo = ""; }
        else if (c === '\r' || c === '\n') {
          if (c === '\r' && texto[i + 1] === '\n') i++;
          fila.push(campo); filas.push(fila); fila = []; campo = "";
        } else campo += c;
      }
      if (campo || fila.length) { fila.push(campo); filas.push(fila); }
      const cabecera = filas.shift() || [];
      return filas.filter(f => f.length === cabecera.length).map(f =>
        Object.fromEntries(cabecera.map((col, i) => [col, f[i]])));
    }

    function abrir(id, actualizarURL = true) {
      const e = catalogo.find(item => item.id === id);
      if (!e) return;
      if (actualizarURL && location.hash !== `#${id}`) history.pushState(null, "", `#${id}`);
      if (visor.dataset.id !== id) {
        visor.src = `${e.carpeta}/index.html`;
        visor.dataset.id = id;
      }
      escena.classList.add("visible");
      document.title = `${e.titulo} · Visor CRTM`;
      document.getElementById("volver").focus({ preventScroll: true });
    }

    function cerrar(actualizarURL = true) {
      if (actualizarURL && location.hash) history.pushState(null, "", location.pathname + location.search);
      escena.classList.remove("visible");
      document.title = "Visor CRTM · Movilidad en Madrid";
    }

    function sincronizar() {
      const id = decodeURIComponent(location.hash.slice(1));
      if (id && catalogo.some(e => e.id === id)) abrir(id, false);
      else cerrar(false);
    }

    document.getElementById("volver").addEventListener("click", () => cerrar());
    document.addEventListener("keydown", e => { if (e.key === "Escape" && escena.classList.contains("visible")) cerrar(); });
    addEventListener("popstate", sincronizar);
    addEventListener("hashchange", sincronizar);

    function mostrarCatalogo() {
      panelLista.replaceChildren();
      if (!catalogo.length) {
        panelLista.innerHTML = '<p class="estado">No hay visualizaciones de estaciones en el catálogo.</p>';
        return;
      }
      for (const e of catalogo) {
        const tarjeta = document.createElement("button");
        tarjeta.type = "button";
        tarjeta.className = "tarjeta";
        const insignia = document.createElement("span");
        insignia.className = "insignia";
        insignia.textContent = e.linea || "M";
        insignia.style.background = e.color || "#2463b4";
        const detalle = document.createElement("span");
        detalle.className = "detalle";
        for (const [clase, contenido] of [
          ["titulo-tarjeta", e.titulo], ["fecha", e.fecha],
          ["subtitulo", e.subtitulo], ["abrir-texto", "Explorar mapa →"]
        ]) {
          const span = document.createElement("span");
          span.className = clase;
          span.textContent = contenido || "";
          detalle.appendChild(span);
        }
        tarjeta.append(insignia, detalle);
        tarjeta.addEventListener("click", () => abrir(e.id));
        panelLista.appendChild(tarjeta);
      }
    }

    async function mostrarEstacionesEnPortada(e) {
      if (!mapa) return;
      try {
        const respuesta = await fetch(`${e.carpeta}/estaciones.csv`);
        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
        const estaciones = parseCSV(await respuesta.text()).filter(s =>
          Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lon)) && s.lat && s.lon);
        if (!estaciones.length) return;
        const puntos = estaciones.map(s => {
          const m = L.circleMarker([Number(s.lat), Number(s.lon)], {
            radius: 3.5, weight: 1, color: e.color || "#2463b4", fillColor: e.color || "#2463b4", fillOpacity: .68
          }).addTo(mapa);
          m.bindTooltip(s.nombre || "Estación");
          m.on("click", () => abrir(e.id));
          return m;
        });
        const limites = L.featureGroup(puntos).getBounds();
        if (limites.isValid()) mapa.fitBounds(limites, {
          paddingTopLeft: [innerWidth > 700 ? 430 : 30, 35],
          paddingBottomRight: [35, innerWidth > 700 ? 35 : Math.min(innerHeight * .62, 430)],
          maxZoom: 12
        });
        const contador = document.getElementById("contador");
        contador.textContent = `${estaciones.length.toLocaleString("es-ES")} estaciones`; 
        contador.hidden = false;
      } catch (error) {
        console.warn("No se pudo cargar la vista previa de estaciones:", error);
      }
    }

    async function iniciar() {
      try {
        const respuesta = await fetch("catalogo.json", { cache: "no-store" });
        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status} al solicitar catalogo.json`);
        const json = await respuesta.json();
        catalogo = (json.mapas || []).filter(e => e.tipo === "estaciones" && e.carpeta);
        mostrarCatalogo();
        sincronizar();
        if (catalogo.length) await mostrarEstacionesEnPortada(catalogo[0]);
      } catch (error) {
        console.error("Error al cargar el catálogo:", error);
        const aviso = document.createElement("p");
        aviso.className = "estado error";
        aviso.textContent = `No se pudo cargar catalogo.json: ${error.message}`;
        panelLista.replaceChildren(aviso);
      }
    }
    iniciar();
  </script>
</body>
</html>
